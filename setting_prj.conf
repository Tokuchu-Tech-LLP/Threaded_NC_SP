# ==============================================================================
# TokuchuTech Fleet - Advanced FOTA, Versioning & MCUmgr Settings
# Overlay configuration: setting_prj.conf
# Does not modify or conflict with existing prj.conf or device-specific prj.conf
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Device Information Service (DIS) - Populates HW & SW Version in BLE Apps
# ------------------------------------------------------------------------------
CONFIG_BT_DIS=y
CONFIG_BT_DIS_MANUF_NAME=y
CONFIG_BT_DIS_MANUF_NAME_STR="TokuchuTech"
CONFIG_BT_DIS_MODEL_NUMBER=y
CONFIG_BT_DIS_MODEL_NUMBER_STR="nRF52840_Node"
CONFIG_BT_DIS_HW_REV=y
CONFIG_BT_DIS_HW_REV_STR="REV_1.0"
CONFIG_BT_DIS_FW_REV=y
CONFIG_BT_DIS_FW_REV_STR="1.0.0"
CONFIG_BT_DIS_SW_REV=y
CONFIG_BT_DIS_SW_REV_STR="1.0.0"

# ------------------------------------------------------------------------------
# 2. Bootloader & MCUboot Image Management (Resolves UNKNOWN Bootloader & SW)
# ------------------------------------------------------------------------------
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y

# ------------------------------------------------------------------------------
# 3. MCUmgr OS Group (Resolves UNKNOWN Kernel, Bootloader Name & Mode, Echo)
# ------------------------------------------------------------------------------
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_INFO=y
CONFIG_MCUMGR_GRP_OS_BOOTLOADER_INFO=y
CONFIG_MCUMGR_GRP_OS_ECHO=y

# ------------------------------------------------------------------------------
# 4. Transport 1: BLE SMP (For Mobile Phone - nRF Device Manager App)
# ------------------------------------------------------------------------------
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_COUNT=4
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=2475

# ------------------------------------------------------------------------------
# 5. Transport 2: OpenThread UDP (For Remote Fleet Updates via RP4 OTBR)
# ------------------------------------------------------------------------------
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_MCUMGR_TRANSPORT_UDP=y
CONFIG_MCUMGR_TRANSPORT_UDP_IPV6=y
CONFIG_MCUMGR_TRANSPORT_UDP_PORT=1337
CONFIG_MCUMGR_TRANSPORT_UDP_STACK_SIZE=1536
