# ==============================================================================
# TokuchuTech Fleet - Universal Master Base Configuration
# Base: IR-nRF-Blaster standard (Picolibc + OpenThread FTD + BLE + Power Mgmt)
# Updated on 2nd Sept 2026
# ==============================================================================

# --- Board & GPIO ---
CONFIG_DK_LIBRARY=y
CONFIG_GPIO=y

# --- Generic Networking & OpenThread FTD ---
CONFIG_NETWORKING=y
CONFIG_COAP=y
CONFIG_NET_L2_OPENTHREAD=y
CONFIG_OPENTHREAD=y
CONFIG_OPENTHREAD_COAP=y
CONFIG_OPENTHREAD_FTD=y
CONFIG_OPENTHREAD_SLAAC=y
CONFIG_OPENTHREAD_DEFAULT_TX_POWER=8

# --- Network Sockets ---
CONFIG_COAP_UTILS=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_IPV6=y
CONFIG_NET_SOCKETS_POLL_MAX=4

# --- OpenThread Network Security & Credentials ---
CONFIG_OPENTHREAD_MANUAL_START=y
CONFIG_OPENTHREAD_JOINER=y
CONFIG_OPENTHREAD_NETWORKKEY="00:11:22:33:44:55:66:77:88:99:aa:bb:cc:dd:ee:ff"
CONFIG_OPENTHREAD_PANID=43969

# --- C-Library & Size Optimizations ---
CONFIG_PICOLIBC=y
CONFIG_CBPRINTF_NANO=y
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_MBEDTLS_SHA1_C=n
CONFIG_FPU=y

# --- Production Hardening & Stripped Logs ---
CONFIG_LOG=n
CONFIG_ASSERT=n
CONFIG_THREAD_NAME=n
CONFIG_DEBUG_THREAD_INFO=n
# CONFIG_LOG_DEFAULT_LEVEL=2
# CONFIG_PRINTK=n

# --- UART Driver (Interrupt Driven, Async DMA Disabled) ---
CONFIG_UART_ASYNC_API=n
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_0_INTERRUPT_DRIVEN=y

# --- NVS Flash & System Control ---
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_REBOOT=y

# --- Standard Stack Sizes ---
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_OPENTHREAD_THREAD_STACK_SIZE=8192

# --- Bootloader & BLE FOTA (MCUmgr SMP) ---
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU=n
CONFIG_NORDIC_QSPI_NOR=n

CONFIG_ZCBOR=y
CONFIG_NET_BUF=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW=y

# Essential MCUmgr groups for BLE FOTA
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_INFO=y
CONFIG_MCUMGR_GRP_OS_BOOTLOADER_INFO=y
CONFIG_MCUMGR_GRP_OS_ECHO=y
CONFIG_MCUMGR_GRP_STAT=n
CONFIG_MCUMGR_GRP_SHELL=n

CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y

# MCUmgr buffer settings (2475 bytes required for nRF Device Manager / DFU Manager)
CONFIG_MCUMGR_TRANSPORT_NETBUF_COUNT=4
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=2475

# Settings storage configuration matching pm_static.yml (0x2000 = 8 KB = 2 sectors of 4 KB)
CONFIG_SETTINGS_NVS_SECTOR_COUNT=2

# --- Hardware Peripherals & Device Identity ---
CONFIG_ADC=y
CONFIG_USE_ADC_SENSOR=y
CONFIG_DEVICE_PREFIX="NC_SP"
CONFIG_HEAP_MEM_POOL_SIZE=8192

# --- Bluetooth LE Base Profile ---
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SMP=y
CONFIG_BT_NUS=y
CONFIG_BT_SETTINGS=n
CONFIG_BT_DEVICE_NAME="NC_SpO2_Device"

# --- Power Management & Device Profile ---
CONFIG_POWEROFF=y
CONFIG_PM_DEVICE=y
CONFIG_DEVICE_DEFAULT_PROFILE="E4A_%.8s"

# --- BLE High-Throughput Engine ---
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_COUNT=6
# CONFIG_BT_BUF_ACL_RX_COUNT=6
CONFIG_BT_CONN_TX_MAX=6
CONFIG_BT_DATA_LEN_UPDATE=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_PHY_UPDATE=y

# Neutral signing version to bypass version enforcement during development
CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION="0.0.0+0"

# Custom Board GPIO & Peripheral Configuration
CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_NORDIC_QSPI_NOR=n

