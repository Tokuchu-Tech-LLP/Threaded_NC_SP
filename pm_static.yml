mcuboot:
  address: 0x0
  end_address: 0xc000
  region: flash_primary
  size: 0xc000

mcuboot_pad:
  address: 0xc000
  end_address: 0xc200
  region: flash_primary
  size: 0x200

app:
  address: 0xc200
  end_address: 0x83000
  region: flash_primary
  size: 0x76e00

mcuboot_primary:
  address: 0xc000
  end_address: 0x83000
  orig_span: &id001
  - mcuboot_pad
  - app
  region: flash_primary
  size: 0x77000
  span: *id001

mcuboot_primary_app:
  address: 0xc200
  end_address: 0x83000
  orig_span: &id002
  - app
  region: flash_primary
  size: 0x76e00
  span: *id002

mcuboot_secondary:
  address: 0x83000
  end_address: 0xfa000
  placement:
    after:
    - mcuboot_primary
    align:
      start: 0x1000
    align_next: 0x1000
  region: flash_primary
  share_size:
  - mcuboot_primary
  size: 0x77000

nvs_storage:
  address: 0xfa000
  end_address: 0xfe000
  placement:
    align:
      start: 0x1000
    before:
    - settings_storage
  region: flash_primary
  size: 0x4000

settings_storage:
  address: 0xfe000
  end_address: 0x100000
  placement:
    align:
      start: 0x1000
    before:
    - end
  region: flash_primary
  size: 0x2000

sram_primary:
  address: 0x20000000
  end_address: 0x20040000
  region: sram_primary
  size: 0x40000
